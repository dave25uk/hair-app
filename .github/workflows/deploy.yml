name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Fail loudly if a secret is missing, instead of happily deploying the
      # "Almost there" setup screen to the live site.
      - name: Check Supabase secrets exist
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          [ -n "$VITE_SUPABASE_URL" ] || { echo "::error::Missing repo secret VITE_SUPABASE_URL"; exit 1; }
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || { echo "::error::Missing repo secret VITE_SUPABASE_ANON_KEY"; exit 1; }

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Hash routing covers deep links, but a 404 fallback keeps Pages happy
      # if anything ever requests a real path.
      - run: cp dist/index.html dist/404.html

      # Pages must be switched on once in Settings -> Pages -> Source:
      # "GitHub Actions". The action's `enablement: true` option cannot do it
      # here because it requires a PAT, not the default GITHUB_TOKEN.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
